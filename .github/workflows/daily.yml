name: Round-up digest

# Manual trigger only. After you finish categorizing in Lunch Money,
# come here, click Run workflow, pick your dates, get an email.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD). Blank = 30 days ago."
        required: false
        type: string
      end_date:
        description: "End date (YYYY-MM-DD). Blank = today."
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run round-up digest
        env:
          LUNCHMONEY_TOKEN: ${{ secrets.LUNCHMONEY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: python roundup.py
