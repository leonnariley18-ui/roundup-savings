name: Round-up tracker

on:
  schedule:
    # 23:00 UTC = 7pm ET (during EDT, summer). In winter (EST) this becomes 6pm ET.
    # The script tracks every day silently and only emails on Wednesday evenings,
    # so the email lands before your Wednesday/Thursday night budgeting session.
    - cron: "0 23 * * *"
  workflow_dispatch:  # lets you trigger manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated log file

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run round-up script
        env:
          LUNCHMONEY_TOKEN: ${{ secrets.LUNCHMONEY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python roundup.py

      - name: Commit log file if it changed
        run: |
          git config user.name "roundup-bot"
          git config user.email "roundup-bot@users.noreply.github.com"
          git add processed_days.json
          if ! git diff --staged --quiet; then
            git commit -m "Update round-up log"
            git push
          fi
