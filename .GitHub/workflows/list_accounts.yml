name: List my Lunch Money accounts

# Run this manually once to find your checking account ID.
# Go to Actions → "List my Lunch Money accounts" → Run workflow.
# The output appears in the workflow log.

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          LUNCHMONEY_TOKEN: ${{ secrets.LUNCHMONEY_TOKEN }}
        run: python list_accounts.py
